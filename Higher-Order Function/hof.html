<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record</title>
    <link rel="stylesheet" href="hof.css">
</head>

<body>
    <input type="text" id="name" placeholder="Your name here">
    <input type="number" id="phone" placeholder="Phone Number here">
    <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Prefered not to say</option>
    </select>
    <button onclick="addStudent()">Add</button>
    <table border="1">
        <thead>
            <tr>
                <th>S/N</th>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="display">
        </tbody>
    </table>
    <script src="hof.js"></script>
</body>

</html>
