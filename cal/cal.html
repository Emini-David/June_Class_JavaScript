<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="cal.css">
    <script src="https://kit.fontawesome.com/ad997d4cdc.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="cal-wrapper">
        <div class="cal">
            <header>
                <div cal-img>
                    <img src="calculator.png" alt="calculator">
                    <p>Calculator</p>
                </div>
                <div class="min-cal">
                    <li><i class="fa-solid fa-minus"></i></li>
                    <li><i class="fa-regular fa-square"></i></li>
                    <div class="red">
                        <li><i class="fa-solid fa-x"></i></li>
                    </div>
                </div>
            </header>

            <nav>
                <div class="standard">
                    <li><i class="fa-solid fa-bars"></i></li>
                    <h3>Standard</h3>
                    <li><i class="fa-regular fa-clock"></i></li>
                    <!-- <li><i class="fa-regular fa-clock"></i></li> -->
                </div>
                <div class="history">
                    <li><i class="fa-regular fa-clock"></i></li>
                </div>
            </nav>

            <div class="display">0</div>

            <section>
                <ul>
                    <li>MC</li>
                    <li>MR</li>
                    <li>M+</li>
                    <li>M-</li>
                    <li>MS</li>
                    <li>M^</li>
                </ul>
            </section>

            <div class="keypad">
                <button class="func">%</button>
                <button class="func">CE</button>
                <button class="func">C</button>
                <button class="func">&#9003;</button>

                <button class="func">1/x</button>
                <button class="func">x<sup>2</sup></button>
                <button class="func">&#8730;x</button>
                <button class="func">÷</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="func">X</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="func">—</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="func">+</button>

                <button class="func">+/—</button>
                <button>0</button>
                <button>.</button>
                <button class="equals">=</button>
            </div>

        </div>

    </div>
    </div>
    
</body>

</html>
