<!DOCTYPE html>
<html>

<head>
    <title>Student Grade Checker</title>
</head>
<style>
    body{
    font-family: Arial;
    background:#f5f5f5;
    text-align:center;
    padding:40px;
}

input{
    width:250px;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    margin-left:10px;
}

#output{
    margin-top:30px;
    font-size:20px;
}
</style>
<body>

    <h2>Student Grade Checker</h2>

    <input type="number" id="score" placeholder="Enter your score">

    <button id="checkBtn">
        Check Result
    </button>

    <div id="output"></div>

    <script>
        let score = document.getElementById("score");
let button = document.getElementById("checkBtn");
let output = document.getElementById("output");

button.addEventListener("click", function(){

    let mark = Number(score.value);

    if(score.value.trim() === ""){
        output.innerHTML = "⚠ Please enter your score.";
    }

    else if(mark < 0 || mark > 100){
        output.innerHTML = "❌ Invalid score!";
    }

    else{

        let grade;
        let point;
        let degree;
        let message;

        if(mark >=70){

            grade="A";
            point=5.0;
            degree="First Class Honours";
            message="🎉 Awesome! You made a First Class! Keep soaring higher!";

        }

        else if(mark >=60){

            grade="B";
            point=4.0;
            degree="Second Class Upper";
            message="👏 Congratulations! You made a 2:1. Well done!";

        }

        else if(mark >=50){

            grade="C";
            point=3.0;
            degree="Second Class Lower";
            message="😊 Nice! You earned a Second Class Lower.";

        }

        else if(mark >=45){

            grade="D";
            point=2.0;
            degree="Third Class";
            message="🎓 Congratulations! Third Class achieved. Keep pushing forward.";

        }

        else if(mark >=40){

            grade="E";
            point=1.0;
            degree="Pass";
            message="👍 You passed! Keep believing in yourself.";

        }

        else{

            grade="F";
            point=0.0;
            degree="Fail";
            message="💪 Don't give up. This is another opportunity to improve.";

        }

        output.innerHTML=`

        <h2>Result</h2>

        <p><strong>Score:</strong> ${mark}%</p>

        <p><strong>Grade:</strong> ${grade}</p>

        <p><strong>Grade Point:</strong> ${point}</p>

        <p><strong>Degree Class:</strong> ${degree}</p>

        <h3>${message}</h3>

        `;

    }

});
    </script>

</body>

</html>
