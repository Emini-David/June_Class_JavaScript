<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JavaScript</title>
</head>
<body>

    <!-- JavaScript Event is something that happens in the browser when clicks as button, type an input, user scroll, a page loads, an image finishes loading, a video ends and move moves etc. -->
    <button id="btn">Click Me</button>
    <button id="deleteBtn">Delete</button>

    <h2 id="title">Hover over me</h2>
    <input id="input" placeholder="Type here">

    <input id="username">
    <p id="output"></p>

    <select id="country">
        <option>Select</option>
        <option>Nigeria</option>
        <option>Ghana</option>
        <option>Ivory Coast</option>
        <option>Benin Republic</option>
    </select><br><br>

    <form id="form">
        <input placeholder="Name">
        <button>Submit</button>
    </form>
    



    <script src="event.js"></script>
</body>
</html>
