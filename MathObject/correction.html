<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="recharge.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="main-container">
        <h3>Recharge Card Generator</h3>
        <div class="flex-container">
            <div class="flex1">
                <label for="text">Network:</label><br><br>
                <select id="network">
                    <option value="Airtel">Airtel</option>
                    <option value="Glo">Glo</option>
                    <option value="MTN">MTN</option>
                    <option value="9Mobile">9Mobile</option>
                </select><br>
                <label for="amount">Amount:</label><br>
                <input type="text" id="amount" placeholder="Enter amount"><br><br>

                <label for="pin">Generated Code:</label><br>
                <input type="text" disabled id="pin" placeholder="247501945828052"><br><br>

                <div class="btn">
                    <button class="gen-btn" onclick="generatePin()">Generate Pin</button>
                    <button class="save-btn" onclick="savePin()">Save Pin</button>
                </div>
            </div>
            <div class="flex2">
                <label for="rechargeCode">Recharge Code:</label><br><br>
                <input type="text" id="rechargeCode" placeholder="*126*247501945828052#"><br><br>
                <button class="recharge" onclick="rechargeNow()">Recharge</button><br><br>

                <label for="searchInput">Search:</label><br><br>
                <input type="text" id="searchInput" placeholder="Recharge Code"><br><br>
            </div>
        </div>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">S/N</th>
                <th scope="col">Network</th>
                <th scope="col">Amount</th>
                <th scope="col">Pin</th>
                <th scope="col">Recharge Code</th>
                <th scope="col">Status</th>
                <th scope="col">Date Created</th>
                <th scope="col">Dated Used</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">

            
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="correction.js"></script>
</body>

</html>
