<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Math object method
        // random method()
        let randomNumber = Math.random()
        console.log(randomNumber);

        let randoms = Math.random() * 100
        console.log(randoms);
        

        // ceil(): it  rounds number automatically even if the number after decimal number is not upto 5
        console.log(Math.ceil(57.90));
        console.log(Math.ceil(57.40));

        // floor(): it does not add anything even if the number after decimal number is more than 5 or 5
        console.log(Math.floor(40.78));
        console.log(Math.floor(40.38));
        
        
        console.log(Math.ceil(34.45));
        console.log(Math.floor(34.87));

        // trunc(): it removes every number after decimal number automatically
        console.log(Math.trunc(345.87));

        console.log(Math.round(57.90));
        console.log(Math.round(57.40));

        let Number = Math.round(Math.random() *10000000000000000)
        console.log(Number);
        
        
        

        // date Object
        let date = new Date()
        console.log(date);
        console.log(date.getDay());
        console.log(date.getFullYear());
        console.log(date.getMonth());
        console.log(date.getDate());
        console.log(date.getHours());
        console.log(date.getMinutes());
        console.log(date.getSeconds());
        console.log(date.getMilliseconds());
        console.log(date.toLocaleDateString());
        
        
                
        
        
        
        
    </script>
</body>
</html>
