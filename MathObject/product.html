    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .page-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 2rem;
            font-weight: 700;
            color: #222;
        }

        #productContainer {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background-color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card h2 {
            margin: 10px 0;
            text-align: center;
        }

        .card p {
            margin: 5px 0;
            text-align: center;
        }

        @media (max-width: 1024px) {
            #productContainer {
                grid-template-columns: repeat(3, minmax(220px, 1fr));
            }
        }

        @media (max-width: 768px) {
            #productContainer {
                grid-template-columns: repeat(2, minmax(200px, 1fr));
                padding: 20px;
            }

            .page-title {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 480px) {
            #productContainer {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .page-title {
                font-size: 1.4rem;
                margin-top: 20px;
            }
        }
    </style>
