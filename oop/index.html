       class Student {
            constructor(name, age, gender, complexion) {
                this.name = name
                this.age = age
                this.gender = gender
                this.complexion = complexion
            }

            canCode(){
                console.log(`${this.name} can code`);
                
            }
       }

       class Teacher extends Student {
        
            constructor(name, age, gender, complexion) {
                super(name, age, gender, complexion)
            }
       }

       let teacherOne = new Teacher("Ayo", 20, "male", "dark");
       console.log(teacherOne);
       teacherOne.canCode()
       

       let studentOne = new Student("Olamide", 12, "female", "light")//creating an object
       console.log(studentOne);
       studentOne.canCode();
       //new - means creating instance of a class
       

       let studentTwo = new Student("David", 20, "male", "dark")
       console.log(studentTwo);
