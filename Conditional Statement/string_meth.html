<!DOCTYPE html>

<body>

    <script>
        //string methods
        let myName = " Jadesola is a brilliant boy "
        //toLowerCase
        console.log(myName.toLowerCase());

        //toUpperCase
        console.log(myName.toUpperCase());

        //trim
        console.log(myName.trim());

        //trimStart
        console.log(myName.trimStart());

        //trimEnd
        console.log(myName.trimEnd());

        //indexOf
        console.log(myName.indexOf("a"));

        //lastIndexOf
        console.log(myName.lastIndexOf("a"));

        //includes
        console.log(myName.includes("brilliant"));

        let namee = "sade"
        console.log(namee.indexOf("s"));




        //string property called "lenght"
        console.log(myName.length);

        // charAt
        // console.log(namme.charAt(2));

        // concat
        let firstName = "Sola";
        let lastName = "Ajayi";
        let space = " "
        console.log(firstName.concat(" ", lastName));
        // console.log(firstName.concat(space).concat(lastName));

        // padStart
        let num = "95"
        console.log(num.padStart(3, "0"));

        // padEnd
        console.log(num.padEnd(8, "$"));


        let fruits = ["Apple", "Orange", "Mango"];
        console.log([fruits[0], fruits[1]].join("-"));
